<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"><title>emasKu — Portofolio Emas Fisik</title><g transform="translate(-9.6 -9.6) scale(1.075)">
  <title id="emasku-title">emasKu Logo - CertiVault</title>
